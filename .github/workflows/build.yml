name: "Tauri Build"

on:
  push:
    branches:
      - deploy
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf fakeroot libarchive-tools

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install app dependencies
        run: pnpm install --frozen-lockfile

      - name: setup sidecars
        run: pnpm run setup

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: "--bundles appimage,deb"

      - name: build arch package (pacman)
        run: |
          sudo apt-get install -y ruby ruby-dev rubygems build-essential libarchive-tools
          sudo gem install --no-document fpm
          APP_VERSION=$(node -p "require('./package.json').version")
          cd src-tauri/target/release/bundle/deb
          cp *.deb /tmp/app.deb
          dpkg-deb -R /tmp/app.deb /tmp/app_extracted
          rm -rf /tmp/app_extracted/DEBIAN /tmp/app.deb
          fpm -s dir -t pacman -n purrfect-download-manager -v "${APP_VERSION}" -a x86_64 -d "webkit2gtk-4.1" -d "gtk3" -d "libayatana-appindicator" --description "Purrfect Download Manager" -m "Purrfect Software Limited" -C /tmp/app_extracted .
          rm -rf /tmp/app_extracted
          mkdir -p ../pacman
          mv *.pkg.tar.* ../pacman/

      - name: package browser extensions
        run: pnpm run package:extension

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-linux
          path: |
            src-tauri/target/release/bundle/**
            dist/*.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          APP_VERSION=$(node -p "require('./package.json').version")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          elif [[ "${APP_VERSION}" == 0.* || "${APP_VERSION}" == *-* ]]; then
            RELEASE_TAG="v${APP_VERSION}"
          else
            ESCAPED_VERSION="${APP_VERSION//./\\.}"
            LAST_RC=$(git tag -l "v${APP_VERSION}-rc*" | sed -nE "s/^v${ESCAPED_VERSION}-rc\.?([0-9]+)$/\1/p" | sort -n | tail -n 1 || true)
            NEXT_RC=$(( ${LAST_RC:-0} + 1 ))
            RELEASE_TAG="v${APP_VERSION}-rc${NEXT_RC}"
          fi

          if [[ "${RELEASE_TAG}" == *-* || "${RELEASE_TAG}" == v0.* ]]; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG=""
          fi

          ASSETS=(
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/pacman/*.pkg.tar.*
            dist/pdm-extension-*-v*.zip
          )

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

          NOTES_FILE="/tmp/release-notes-${RELEASE_TAG}.md"
          node scripts/generate-release-notes.js \
            --tag "${RELEASE_TAG}" \
            --target "${GITHUB_SHA}" \
            --out "${NOTES_FILE}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${ASSETS[@]}" --clobber
            gh release edit "${RELEASE_TAG}" --notes-file "${NOTES_FILE}"
          else
            gh release create "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Release ${RELEASE_TAG}" \
              --notes-file "${NOTES_FILE}" \
              ${PRERELEASE_FLAG} \
              "${ASSETS[@]}"
          fi
