[package]
name = "purrfect-download-manager"
version = "0.1.1"
description = "Purrfect Download Manager - A fast and aesthetic download manager built with Tauri and Next.js"
authors = ["Sakib"]
license = "MIT"
repository = "https://github.com/sakibtamim/purrfect-download-manager"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "PurrfectDownloadManager"
path = "src/main.rs"

[lib]
name = "purrfect_download_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2.0.0"
tiny_http = "0.12.0"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
